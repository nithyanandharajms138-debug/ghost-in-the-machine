
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ghost in the Machine</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>GHOST IN THE MACHINE</h1>

    <div id="terminal">
        <p>[ SYSTEM BOOTING... ]</p>
        <p>[ A PRESENCE HAS BEEN DETECTED. ]</p>
        <p>Ghost: Who are you?</p>
    </div>

    <form id="chat-form">
        <label for="user-input">You &gt;</label>
        <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            autocomplete="off"
        >
        <button type="submit">Send</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
